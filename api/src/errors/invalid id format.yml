info:
  name: invalid id format
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/src/runs/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: abc123
      description: invalid id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 6 character src id
    description: HTTP 400 error when a run ID is not 8 characters long
    request:
      url: https://api.speedrun.io/src/runs/abc123
      method: GET
      headers:
        - name: Content-Type
          value: application/json
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Mon, 07 Sep 2026 05:18:41 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Llength
          value: "87"
        - name: Transfer-Encoding
          value: chunked
        - name: Connection
          value: keep-alive
        - name: Server
          value: cloudflare
        - name: X-RateLimit-Exempt
          value: "true"
        - name: X-RateLimit-Method
          value: ip
        - name: X-RateLimit-Namespace
          value: src
        - name: X-SRIO-Perf
          value: "0.005656"
        - name: X-SRIO-Request-ID
          value: 48efe2fe-37fb-4dab-8539-4066b5902b16
        - name: X-SRIO-Timestamp
          value: "1788757689.342597"
        - name: X-SRIO-URI
          value: /src/games/abc123
        - name: Access-Control-Allow-Credentials
          value: "true"
        - name: Access-Control-Allow-Methods
          value: GET, OPTIONS
        - name: Access-Control-Allow-Headers
