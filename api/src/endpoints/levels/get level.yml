info:
  name: get level
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/src/levels/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: w6q44qpd
      description: example level id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
