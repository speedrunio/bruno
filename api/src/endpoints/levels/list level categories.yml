info:
  name: list level categories
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/src/levels/{{slug}}/categories
  auth: inherit

runtime:
  variables:
    - name: slug
      value: 495lx03d
      description: example level id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "hollow knight: pantheon of the master"
    description: use an ID to list the categories for a specific level
    request:
      url: https://api.speedrun.io/src/levels/495lx03d/categories
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": [
              {
                "id": "wkpq608d",
                "name": "Level",
                "weblink": "https://www.speedrun.com/hollowknight/levels?h=Level&x=wkpq608d",
                "type": "per-level",
                "rules": "",
                "players": {
                  "type": "exactly",
                  "value": 1
                },
                "miscellaneous": false,
                "links": [
                  {
                    "rel": "self",
                    "uri": "https://www.speedrun.com/api/v1/categories/wkpq608d"
                  },
                  {
                    "rel": "game",
                    "uri": "https://www.speedrun.com/api/v1/games/76rqmld8"
                  },
                  {
                    "rel": "variables",
                    "uri": "https://www.speedrun.com/api/v1/categories/wkpq608d/variables"
                  },
                  {
                    "rel": "records",
                    "uri": "https://www.speedrun.com/api/v1/categories/wkpq608d/records"
                  },
                  {
                    "rel": "runs",
                    "uri": "https://www.speedrun.com/api/v1/runs?category=wkpq608d"
                  }
                ]
              }
            ],
            "pagination": {
              "offset": 0,
              "max": 20,
              "size": 1
            },
            "status": 200
          }
