info:
  name: list level variables
  type: http
  seq: 3

http:
  method: GET
  url: https://api.speedrun.io/src/levels/{{slug}}/variables
  auth: inherit

runtime:
  variables:
    - name: slug
      value: kwj2rl09
      description: example level id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

