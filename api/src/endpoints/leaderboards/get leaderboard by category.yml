info:
  name: get leaderboard by category
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/src/leaderboards/{{slug_game}}/category/{{slug_category}}
  auth: inherit

runtime:
  variables:
    - name: slug_game
      value: 4d7xvzr1
      description: example game id
    - name: slug_category
      value: wdmjz9xd
      description: example category id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

