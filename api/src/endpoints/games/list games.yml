info:
  name: list games
  type: http
  seq: 3

http:
  method: GET
  url: https://api.speedrun.io/src/games
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: list the first 10
    description: a list of the first 10 games using max=10, default sorted by name ascending
    request:
      url: https://api.speedrun.io/src/games?max=10
      method: GET
      params:
        - name: max
          value: "10"
          type: query
