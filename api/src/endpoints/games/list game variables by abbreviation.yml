info:
  name: list game variables by abbreviation
  type: http
  seq: 9

http:
  method: GET
  url: https://api.speedrun.io/src/games/{{slug}}/variables
  auth: inherit

runtime:
  variables:
    - name: slug
      value: re2
      description: example game abbreviation

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
