                ],
                "miscellaneous": false,
                "name": "New Engine",
                "players": {
                  "type": "exactly",
                  "value": 1
                },
                "rules": "# IL Rules\n\nStart the chapter either from the menu or by starting the first map with the map command. Using a save for starting a run is only allowed in Point Insertion.\n\n# **Version**\n\nHalf-Life 2 New Engine runs must be done on one of the officially released versions of the game. The most commonly used versions by the community are 4260, 5288, or the latest version of the game on Steam. **The use of Ghosting and Versions 2.5 or older of 5135 Unpack is banned** as these versions do not comply with being an official release.\n\nUsing versions acquired from unofficial or illegal sources is not allowed.\n\nUsing maps from different versions is not allowed, this means you must use maps consistent with the version of the game you are running (i.e. you can't take maps from Steampipe and use them in Unpack).\n\nConsole runs currently sit on the same leaderboards and follow the same rules as PC runs, with the exception of timing being done in Real Time. This is subject to change in the future.\n\n# **Commands and Binds**\n\nThe use, and binding of any command accessible from the pause menu is allowed. All cheat commands, console exclusive commands, and commands that change gameplay are not allowed with the exceptions being listed on the community Whitelist. If you have questions over whether a command is legal, please ask in Source-help, or make a forum post on Half-Life 2 Speedrun.com page.\n\nExamples of **NOT** allowed console exclusive commands include ent_remove, unpause, “- commands” (ex. -speed), exec, toggle or BindToggle. These commands can never be executed by the player during the duration of the run.\n\nThe use of scripts or macros is not allowed. This includes Aliases, which are considered to be scripts.\n\nYou are allowed to bind the same command to multiple keys (i.e. +jump to mwheelup and mwheeldown).\n\nMultiple commands can also be bound to the same key. (i.e. bind x “save glitch;load glitch”.\n\nThe use of two input methods in a run at the same is not allowed. This means you cannot use a keyboard and mouse at the same time as a controller.\n\nSending analogue input via analogue keyboard is not allowed.\n\nYou are allowed to 1:1 remap keys through the use of external mouse and keyboard software to use keys that wouldn’t normally be recognized by the game. (ex. For using a mouse8 button in game)\n\n# **Whitelist**\n\nThe community whitelist of console exclusive commands acts as both a set of quality of life commands, and commands that have had to be grandfathered in to maintain the current route.\n\n- **cl_showpos, use weapon_x, reload:** these commands are the main exceptions that have been made in terms of console exclusive commands that change how the run is played out.\n\n- **toggle_duck**: Usually only bindable when using a controller.\n\n- **cl_showfps, net_graph:** two different ways of viewing your fps in game as opposed to viewing it with third party tools.\n\n- **mat_dxlevel**: **Must be set to either 90 or 95**. Players may lower the value from 95 for  performance reasons. Values under 90 result in modification of game physics and fullbright auto-enabling on certain maps.\n\n- **r_portalsopenall 1**: quality of life command that opens up the rendering portals in order to draw the full game world when you skip a trigger that would handle it otherwise.\n\n- **fps_max 1-999: 999** is the max allowed value as anything over it will cause the game to enter a sort of timescaled like sped up state. Uncapping fps by setting fps_max to 0 is not allowed.\n\n- **viewmodel_fov 54-90**: serves as an allowed HUD modification. Going under 54 or above 90 is not allowed as it will cause the viewmodel to start disappearing. Disabling the viewmodel completely is not allowed.\n- **save_screenshot**: Disables saving save thumbnails for less stutter and disk usage.\n- **sv_max_queries_sec**: Can be increased to a value like 9 to prevent long loads from occuring.",
                "type": "per-level",
                "weblink": "https://www.speedrun.com/hl2/levels?h=New_Engine&x=824x05nd"
