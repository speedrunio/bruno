                "rules": "General Rules:\n\n- The dungeons, upon the start of the run, must be in their untouched state. (Cannot have been entered before the run)\n- Cannot have Items from the Dungeon being ran. (Boss Remains, Heart Container, Dungeon Item)\n- Cannot have Fierce Deity's Mask (not obtainable without having beat all dungeons before hand)\n- Starting from file select is allowed. \n- Timing starts upon gaining control of Link in the main entrance room of the dungeon. (first frame of movement, or first frame of the ui re-appearing after the intro cutscene)\n- Timing ends upon losing control of Link. (stepping into the blue warp to collect the boss remains, the frame the remains disappear and link begins picking them up) \n- Runs will be in 1 segment; savewarp and deaths warp are allowed. (unless stated otherwise)\n- Wii VC inject is banned.\n- Wii-U VC inject is banned.\n- KZ, the Majora's Mask Practice Rom, is allowed for IL submissions. You are allowed to use cheats, savestates, memfiles, etc. in order to setup your run and do runs without needing to re-setup your file. All items you give yourself must be theoretically possible to get with the restrictions of the category you are running (for example, you may not give yourself the dungeon item), nor are you allowed to use the flag editor to edit any of the dungeon's flags--the dungeon's state must remain untouched. During the run, all KZ cheats, input viewers, and watches must be disabled. All KZ menus and button command functionalities are banned for the duration of the run.\n- Controller adapters are permitted. The following rules apply:\n- Analog stick mappings that decrease the difficulty of holding the ESS position relative to official, unmodified controllers on that console are prohibited (with the exceptions of extremely minor changes to ESS position and changes made to the deadzone (such as Raphnets)).\n- Any adapters used may not map analog stick inputs to buttons (mapping the C-stick to the C-buttons is fine).\n- Notch calibration, and therefore adapters that expressly calibrate notches, are allowed.\n- Macros, including the use of turbo functions, is banned.\n- Modifying the control stick of a controller in any intentional way, including notch carving for the sake of getting \"better diagonals\" or an angle that is impossible to just as easily obtain on an official, unmodified controller, is banned.\n- Controller modification of digital inputs, including the removal of a GameCube controller's triggers' springs, is allowed (assuming the modification does not result in an analog output).\nPart replacement is acceptable, including swapping out a GameCube controller's control stick for a Wii nunchuk's control stick.\n- Emulators are allowed. The allowed emulators include Project64, Mupen64Plus and Dolphin. There is no time cap for emulators. All emulators must be on the latest build with default settings (including the cpu clock speed for Dolphin), with the exception of very specific settings on Dolphin, as follows:\n- Changing the Backend to Direct3D/DirectX for Windows, Vulkan for Linux, or Metal for MacOS.\n- Changing the Adapter to the most powerful graphics device on your PC.\n- Checking \"Skip EFB Access from CPU\"\n- Unchecking \"Store EFB Copies to Texture Only\"\n- Changing the Fallback Region to NTSC-U or NTSC-J.\n- EverDrive is allowed. However, it must be on v2.5, v3, or x7 and run the rom via the auto-boot function. 64Drive is allowed. There is no time cap for either of these.\n-Nintendont is banned for all submissions.\n- The intro cutscene can be cleared. (this is the one exception to the first rule)\n\nAny% Glitchless:\n\nSet up the file and beat the dungeon without performing any of the banned techniques.\n\nBanned Techniques:\n\n- Infinite Sword Glitch\n- Hovering\n- Recoil Flip\n- Long Jump\n- Megaflip\n- Recoil Jump\n- Hyper Extended Superslide/Extended Superslide\n- Superslide\n- A-Slide\n- Z-Slide\n- Weirdshot\n- Ground Jump\n- Clipping\n- Out of Bounds\n- Seamwalking\n- Cutscene Skips\n- Ocarina Items \n- Stale Reference Manipulation\n- Text Overflow\n- Zora Clipping\n- Flying Zora\n- Superswim\n- Spring Water Switch Activation\n- Song Storage\n- Timestop\n- Temp B\n- Weird B\n- Ocarina on B\n- Mask Storage\n- Goron Missile\n- Goron Mega Pound\n- 0th Day/Owl Save Storage\n- 4th Day\n- Equip Swap\n- Action Swap / Quickdraw\n- Bottle Duplication\n- Item Manipulation (BA/GIM/etc.)\n- Extended Bow/Hookshot\n- Opening Flaming Chests\n- Collection Delay\n- Return A\n- Down A\n- Restricted Items\n- Backwalking past East Clocktown Guard\n- Deku Sword\n- Day Reset / Day Skip\n- False Mask\n- Saving at Owl Statues on Epona\n- Using day transitions to teleport Epona\n- Remote Control Epona\n- Epona Hovering\n- Antigrav\n- Items Diving \n- Flame Storage\n- Using cutscenes to displace items off of \nplatforms\n- Delaying cutscenes from starting\n- Rolling through or on top of blocks in the \nchest minigame\n- Moving while in first person\n- Milk Swap/Remote Hookshot\n\n-----------------\nFurther Explanations:\n\n- Cutscene Skip : Causing a load to trigger during a cutscene\n- Out of Bounds : Surfaces that are exposed to the lowest void plane and unloaded areas\n- Clipping : Moving through solid objects or collision (popups are not included in this definition [Deku Palace, Oceanside Spider House, Pictograph Hut, etc.])\n- Spring Water Switch Activation : Using Spring Water (or Hot Spring Water) to cause switches such as Sunblocks to activate\n- Item Diving : Using item cutscenes in order to drop off of edges (Ocarina Diving, Bottle Diving, etc.)\n- Hovering : Slashing against a ledge during the Snowhead wind can result in Link obtaining terminal velocity (-20 Y Velocity) while his Y Position stays unchanged, which constitutes a hovering state. A community vote decided that all forms of Lullaby Skip that slash against the wind are banned.",
                "type": "per-level",
                "weblink": "https://www.speedrun.com/mm/levels?h=Glitchless_Any&x=n2yr8z8d"
              }
            ],
            "pagination": {
              "offset": 0,
              "max": 20,
              "size": 9
            },
            "status": 200
          }
