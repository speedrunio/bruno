info:
  name: list game categories by abbreviation
  type: http
  seq: 5

http:
  method: GET
  url: https://api.speedrun.io/src/games/{{slug}}/categories
  auth: inherit

runtime:
  variables:
    - name: slug
      value: mm
      description: example game abbreviation

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "zelda: majora's mask"
    description: use an abbreviation to list the categories for a specific game
