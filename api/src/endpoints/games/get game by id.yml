info:
  name: get game by id
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/src/games/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: 4d7x22r1
      description: example game id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

