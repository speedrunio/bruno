info:
  name: list category variables
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/src/categories/{{slug}}/variables
  auth: inherit

runtime:
  variables:
    - name: slug
      value: wkpq608d
      description: example category id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

