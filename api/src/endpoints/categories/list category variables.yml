                      "rules": "- [한국어](https://docs.google.com/document/d/1mH84ryy1PxeQKo6wXlqqgdml-aSkBYfvp433DWBIgo8/edit) - @Exclamation_MarkYT\r\n- [Português](https://docs.google.com/spreadsheets/d/114gJxnm8ZI3BYkPTf2OVEyF0cq_psmWjq9EAtf6dBtY/edit?ts=601f050b#gid=355911141) - @Airam_98\r\n- [Italiano](https://docs.google.com/document/d/1DfY8NrVRDcvpl2JxICArrvyA2fy8FggtTj2btYA9WZA/edit?ts=601f1678#heading=h.rg5ha2a9puo2) - @SBDWolf\r\n- [Pусский](https://docs.google.com/document/d/11EEqRcQLu4IFqr_wvaBwfpA7CRc0EZujBQ1VIsJwLlo/edit#heading=h.2meszm5feh0z) - @Facejif\r\n\nPlaying on a clean file, beat the game as fast as possible by defeating The Devil (or entering King Dice's level for Simple mode).\n\nFor Expert, you must use the Fresh Expert Glitch. See: [link](http://www.docs.google.com/document/d/1OEchIopd8IqfKu283U0rWYzN44mg-OJSR9pnlSp3UyE/edit#) (towards bottom of document under Glitches - Difficulty).\n\nMust be played on the Legacy (1.0) patch.\n\nAll of the game rules apply."
                    },
                    "4qy2mr61": {
                      "flags": {
                        "miscellaneous": false
                      },
                      "label": "Full Clear",
                      "rules": "-[Pусский](https://docs.google.com/document/d/11EEqRcQLu4IFqr_wvaBwfpA7CRc0EZujBQ1VIsJwLlo/edit#heading=h.33gwyc8vnoot) - @Facejif\n\nPlaying on a clean file, reach the credits doing everything the game offers while playing on Regular. This includes: all levels, all coins, all items, all bosses, and all King Dice fights (these don't have to be done in a single King Dice fight, each miniboss has to be killed at least once in the run though).\n\nFor Simple, since you can't fight King Dice, the minibosses aren't required, and the timer stops on selecting Regular on King Dice.\n\nFor Expert, you must use the Fresh Expert Glitch. See: [link](http://www.docs.google.com/document/d/1OEchIopd8IqfKu283U0rWYzN44mg-OJSR9pnlSp3UyE/edit#) (towards bottom of document under Glitches - Difficulty).\n\nMust be played on the Legacy (1.0) patch.\n\nAll of the game rules apply."
                    },
                    "5ley05m1": {
                      "flags": {
                        "miscellaneous": false
                      },
                      "label": "Low%",
                      "rules": "- [Pусский](https://docs.google.com/document/d/11EEqRcQLu4IFqr_wvaBwfpA7CRc0EZujBQ1VIsJwLlo/edit#heading=h.8rv29e9ayxsf) - @Facejif\r\n\nPlaying on a clean file, beat The Devil doing only what is necessary to beat the game. This means no Run and Guns/Mausoleums, no coins, and no weapons* other than Peashooter and plane Machine Gun. For Simple, only the same three bosses required in Simple% are required here. That is to say, Rumor Honeybottoms, Sally Stageplay, and Phantom Express are the only bosses needed.\n\n*Peashooter and Machine Gun EX attacks are allowed, since they're inherently attached to the weapons in question.\n\nFor Expert, you must use the Fresh Expert Glitch. See: [link](https://docs.google.com/document/d/1OEchIopd8IqfKu283U0rWYzN44mg-OJSR9pnlSp3UyE/edit#) (towards bottom of document under Glitches - Difficulty).\n\nMust be played on the Legacy (1.0) patch.\n\nAll of the game rules apply."
                    },
                    "5q8v3oyl": {
                      "flags": {
                        "miscellaneous": false
                      },
                      "label": "All Flags",
                      "rules": "- [Pусский](https://docs.google.com/document/d/11EEqRcQLu4IFqr_wvaBwfpA7CRc0EZujBQ1VIsJwLlo/edit#heading=h.6kjx9m7hyfoq) - @Facejif\r\n\nPlaying on a clean file, defeat all main bosses (i.e. you don't have to beat all 9 of King Dice's \"minibosses\") on a single difficulty. You must also complete all 6 run and gun stages.\n\nFor Expert, you must use the Fresh Expert Glitch. See: [link](http://www.docs.google.com/document/d/1OEchIopd8IqfKu283U0rWYzN44mg-OJSR9pnlSp3UyE/edit#) (towards bottom of document under Glitches - Difficulty).\n\nMust be played on the Legacy (1.0) patch.\n\nAll of the game rules apply."
                    }
                  }
                }
