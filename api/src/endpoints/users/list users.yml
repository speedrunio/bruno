info:
  name: list users
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/src/users
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

