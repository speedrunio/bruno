info:
  name: list runs
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/v1/runs
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: list the 10 most recent runs
    description: a list of the first 10 runs using max=10, sorted by submitted descending
    request:
      url: https://api.speedrun.io/v1/runs?max=10&orderby=submitted&direction=desc
      method: GET
      headers:
        - name: Content-Type
          value: application/json
      params:
        - name: max
          value: "10"
          type: query
        - name: orderby
          value: submitted
          type: query
        - name: direction
          value: desc
          type: query
