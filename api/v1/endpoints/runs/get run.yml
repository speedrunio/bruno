info:
  name: get run
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/v1/runs/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: m74q664m
      description: example run id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

