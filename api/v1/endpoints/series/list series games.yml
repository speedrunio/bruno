info:
  name: list series games
  type: http
  seq: 3

http:
  method: GET
  url: https://api.speedrun.io/v1/series/{{slug}}/games
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: slug
      value: rv7emz49

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: super mario
    description: use an ID to list the first 25 games for a a specific series using max=25
    request:
      url: https://api.speedrun.io/v1/series/rv7emz49/games?max=25
      method: GET
      params:
        - name: max
          value: "25"
          type: query
