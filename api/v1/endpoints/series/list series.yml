info:
  name: list series
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/v1/series
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
