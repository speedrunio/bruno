info:
  name: get series
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/v1/series/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: rv7emz49
      description: example series id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: super mario
    description: use an ID to get a specific series
    request:
      url: https://api.speedrun.io/v1/series/rv7emz49
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
              "series": [
                {
                  "abbreviation": "mario",
                  "created": null,
                  "discord": "",
