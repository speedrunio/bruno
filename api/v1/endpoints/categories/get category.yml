info:
  name: get category
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/v1/categories/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: jdz8oprd
      description: example category id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "celeste: all red berries"
    description: use an ID to get a specific category
    request:
      url: https://api.speedrun.io/v1/categories/jdz8oprd
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
              "categories": [
                {
                  "miscellaneous": false,
                  "name": "All Red Berries",
                  "players": {
                    "type": "exactly",
                    "value": 1
                  },
                  "rules": "## Category Objective\r\n* Collect all 175 red berries and complete Core from a new file.",
                  "src_category_id": "jdz8oprd",
                  "srio_category_id": "1n73qubpwsdsw",
                  "type": "per-game"
                }
              ]
            },
            "meta": {
              "schema": "1.0",
