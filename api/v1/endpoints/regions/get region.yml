info:
  name: get region
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/v1/regions/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: pr184lqn
      description: example region id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: usa / ntsc
    description: use an ID to get a specific region
    request:
      url: https://api.speedrun.io/v1/regions/pr184lqn
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
              "regions": [
                {
                  "name": "USA / NTSC",
                  "src_region_id": "pr184lqn",
                  "srio_region_id": "07v0sp0bi6gij"
                }
              ]
            },
            "meta": {
