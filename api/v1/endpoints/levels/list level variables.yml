http:
  method: GET
  url: https://api.speedrun.io/v1/levels/{{slug}}/variables
  auth: inherit

runtime:
  variables:
    - name: slug
      value: kwj2rl09
      description: example level id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

