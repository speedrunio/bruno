info:
  name: list level categories
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/v1/levels/{{slug}}/categories
  auth: inherit

runtime:
  variables:
    - name: slug
      value: 495lx03d
      description: example level id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

