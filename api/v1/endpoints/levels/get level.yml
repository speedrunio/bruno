info:
  name: get level
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/v1/levels/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: w6q44qpd
      description: example level id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "plateup!: turbo food card challenge"
    description: use an ID to get a specific level
    request:
      url: https://api.speedrun.io/v1/levels/w6q44qpd
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
