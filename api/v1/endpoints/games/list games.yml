info:
  name: list games
  type: http
  seq: 3

http:
  method: GET
  url: https://api.speedrun.io/v1/games
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
