                    "_note": "`choices` is deprecated, please use `values` instead",
                    "choices": {
                      "21g654oq": "Base Game",
                      "jqzw95kq": "Base + DLC",
                      "z19097k1": "Stranger 100%"
                    },
                    "default": "21g654oq",
                    "values": {
                      "21g654oq": {
                        "flags": {
                          "miscellaneous": false
                        },
                        "label": "Base Game",
                        "rules": "- Complete your ship log and get the main ending, to consider your ship log completed it needs to satisfy these requirements for one of the legal versions (even if it's not the one being run):\r\n    - Every card unlocked.\r\n    - All permanent entries for every card.\r\n    - Every achievable link between two cards.\r\n- After completing your run you must load your previous save and show the content of every card in the Ship Log's rumor mode. Quitting out of the game during the credits is allowed but stopping your recording isn't. The game version on the main menu must be visible.\r\n- The timer starts when you press the key to wake up and ends on the final explosion.\r\n- [**Verification Image** (link)](https://outerwilds.ventures/)\n\n- If a fact is not obtainable on a version because of a bug, the run is still valid as long as you still perform the action that should have unlocked it."
                      },
                      "jqzw95kq": {
                        "flags": {
                          "miscellaneous": false
                        },
                        "label": "Base + DLC",
                        "rules": "- Complete your ship log and get the main ending, to consider your ship log completed it needs to satisfy these requirements for one of the legal versions (even if it's not the one being run):\r\n    - Every card unlocked.\r\n    - All permanent entries for every card.\r\n    - Every achievable link between two cards.\r\n- After completing your run you must load your previous save and show the content of every card in the Ship Log's rumor mode. Quitting out of the game during the credits is allowed but stopping your recording isn't. The game version on the main menu must be visible.\r\n- The timer starts when you press the key to wake up and ends on the final explosion.\r\n\n- (If running on 1.1.12+ : You need 4 Facts on the Starlit Cove Card)\r\n- [**Verification Image** (link)](https://outerwilds.ventures/)\r\n- If a fact is not obtainable on a version because of a bug, the run is still valid as long as you still perform the action that should have unlocked it"
                      },
                      "z19097k1": {
                        "flags": {
                          "miscellaneous": false
                        },
                        "label": "Stranger 100%",
                        "rules": "- Unlock every card, all permanent entries for every card and every achievable link between two cards you can get on the Stranger.\r\n*To consider your ship log completed it needs to satisfy these requirements for one of the legal versions (even if it's not the one being run)*\n- Runs may start from \"Resume Expedition\". Launch codes and sleeping may be unlocked.\r\n- After completing your run you must load your previous save and show the content of every card in the Ship Log's rumor mode. The game version on the main menu must be visible.\r\n- The timer starts when you press the key to wake up and ends when you quit out after getting the last fact.\r\n\n- (If running on 1.1.12+ : You need 4 Facts on the Starlit Cove Card.)\n- [**Verification Image** (link)](https://outerwilds.ventures/)\r\n\n- If a fact is not obtainable on a version because of a bug, the run is still valid as long as you still perform the action that should have unlocked it"
                      }
                    }
