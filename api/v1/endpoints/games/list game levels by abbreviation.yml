info:
  name: list game levels by abbreviation
  type: http
  seq: 7

http:
  method: GET
  url: https://api.speedrun.io/v1/games/{{slug}}/levels
  auth: inherit

runtime:
  variables:
    - name: slug
      value: botw
      description: example game abbreviation

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

