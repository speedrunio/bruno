info:
  name: list game categories by id
  type: http
  seq: 4

http:
  method: GET
  url: https://api.speedrun.io/v1/games/{{slug}}/categories
  auth: inherit

runtime:
  variables:
    - name: slug
      value: 3dxkz0v1
      description: example game id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: metroid dread
    description: use an ID to list the categories for a specific game
    request:
      url: https://api.speedrun.io/v1/games/3dxkz0v1/categories
      method: GET
