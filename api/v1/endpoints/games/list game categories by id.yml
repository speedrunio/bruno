                  "rules": "# Individual Level  (IL) Video Proof\n\n**For Individual Levels (ILs), proof is always required.** Your IL must have footage of the \"Boss Rush Practice\" or \"Dread Rush Practice\" screen at the **end** of an individual practice attempt (*after* you have defeated the boss you are challenging). ILs that do not have this footage, or ILs that are clipped from full Boss Rush runs **will be rejected**.\n\nIf your level and your \"Boss Rush Practice\" end screen both fit within the Nintendo Switch video capture maximum video length (30 seconds), you may submit videos recorded on the Switch itself. You may not stitch multiple Nintendo Switch video clips together for submission. If your footage is longer than 30 seconds, please use a capture card instead.\n\n---",
