info:
  name: get gametype
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/v1/gametypes/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: 53no817x
      description: example gametype id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: category extensions
    description: use an ID to get a specific gametype
    request:
      url: https://api.speedrun.io/v1/gametypes/53no817x
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
              "gametypes": [
                {
                  "allows-base-game": true,
                  "name": "Category Extension",
                  "src_gametype_id": "53no817x",
                  "srio_gametype_id": "0hrxrugxen05l"
                }
              ]
            },
