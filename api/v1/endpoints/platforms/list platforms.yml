info:
  name: list platforms
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/v1/platforms
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: list the first 10
    description: a list of the first 10 platforms using max=10, default sorted by name ascending
    request:
      url: https://api.speedrun.io/v1/platforms?max=10
      method: GET
      params:
        - name: max
          value: "10"
          type: query
