info:
  name: get platform
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/v1/platforms/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: kz9wlm6p
      description: example platform id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: pc platform
    description: use an ID to get a specific platform
    request:
      url: https://api.speedrun.io/v1/platforms/8gej2n93
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
              "platforms": [
                {
                  "name": "PC",
                  "released": 1970,
                  "src_platform_id": "8gej2n93",
                  "srio_platform_id": "1iw9do42v06un"
                }
              ]
            },
            "meta": {
