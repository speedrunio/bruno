info:
  name: id not found
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/src/games/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: abcd1234
      description: non existant game id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: no such game
    request:
      url: https://api.speedrun.io/src/games/abcd1234
      method: GET
      headers:
        - name: Content-Type
          value: application/json
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Date
          value: Mon, 07 Sep 2026 05:08:09 GMT
        - name: Content-Type
          value: application/json
        - name: Transfer-Encoding
          value: chunked
        - name: Connection
          value: keep-alive
        - name: Server
          value: cloudflare
        - name: X-RateLimit-Exempt
          value: "true"
        - name: X-RateLimit-Method
          value: ip
        - name: X-RateLimit-Namespace
          value: src
        - name: X-SRIO-Perf
          value: 0.0.002051
        - name: X-SRIO-Request-ID
          value: b1fde05c-4137-4990-aea9-7783832f5a20
        - name: X-SRIO-Timestamp
          value: "1788758321.245135"
        - name: X-SRIO-URI
          value: /src/games/abcd1234
        - name: Access-Control-Allow-Credentials
          value: "true"
        - name: Access-Control-Allow-Methods
          value: GET, OPTIONS
        - name: Access-Control-Allow-Headers
          value: Content-Type, Authorization
        - name: CF-Cache-Status
          value: Dynamic
        - name: CF-Ray
          value: a37331a628a84379-EWR
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "NOT_FOUND",
              "msg": "games not found"
            },
            "status": 404
          }
