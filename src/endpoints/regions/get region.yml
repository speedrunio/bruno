info:
  name: get region
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/src/regions/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: pr184lqn
      description: example region id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: usa / ntsc
    description: use an ID to get a specific region
    request:
      url: https://api.speedrun.io/src/regions/pr184lqn
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
              "id": "pr184lqn",
              "links": [
                {
                  "rel": "self",
                  "uri": "https://www.speedrun.com/api/v1/regions/pr184lqn"
                },
                {
                  "rel": "games",
                  "uri": "https://www.speedrun.com/api/v1/games?region=pr184lqn"
                },
                {
                  "rel": "runs",
                  "uri": "https://www.speedrun.com/api/v1/runs?region=pr184lqn"
                }
              ],
              "name": "USA / NTSC"
            },
            "status": 200
          }
