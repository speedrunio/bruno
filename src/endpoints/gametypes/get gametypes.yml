info:
  name: get gametypes
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/src/gametypes
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: list the first 10
    description: a list of the first 10 gametypes using max=10, default sorted by name
    request:
      url: https://api.speedrun.io/src/gametypes?max=10
      method: GET
      params:
        - name: max
          value: "10"
          type: query
