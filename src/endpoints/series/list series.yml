info:
  name: list series
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/src/series?abbreviation=metroid
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: abbreviation
      value: metroid
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: list the first 10
    description: a list of the first 10 series using max=10, default sorted by name ascending
    request:
      url: https://api.speedrun.io/src/series?max=10
      method: GET
      params:
        - name: max
          value: "10"
          type: query
