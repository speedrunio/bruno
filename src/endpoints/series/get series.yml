info:
  name: get series
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/src/series/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: rv7emz49
      description: example series id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
