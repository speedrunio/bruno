info:
  name: get user by id
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/src/users/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: 8d3el3lx
      description: example user id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

