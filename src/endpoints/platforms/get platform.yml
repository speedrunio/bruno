info:
  name: get platform
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/src/platforms/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: 8gej2n93
      description: example platform id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: pc platform
    description: use an ID to get a specific platform
    request:
      url: https://api.speedrun.io/src/platforms/8gej2n93
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
              "id": "8gej2n93",
              "links": [
                {
                  "rel": "self",
                  "uri": "https://www.speedrun.com/api/v1/platforms/8gej2n93"
                },
                {
                  "rel": "games",
                  "uri": "https://www.speedrun.com/api/v1/games?platform=8gej2n93"
                },
                {
                  "rel": "runs",
                  "uri": "https://www.speedrun.com/api/v1/runs?platform=8gej2n93"
                }
              ],
              "name": "PC",
              "released": 1970
            },
            "status": 200
          }
  - name: analogue nt mini
    description: use an ID to get a specific platform
    request:
      url: https://api.speedrun.io/src/platforms/kz9wlm6p
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
              "id": "kz9wlm6p",
              "links": [
                {
                  "rel": "self",
                  "uri": "https://www.speedrun.com/api/v1/platforms/kz9wlm6p"
                },
                {
                  "rel": "games",
                  "uri": "https://www.speedrun.com/api/v1/games?platform=kz9wlm6p"
                },
                {
                  "rel": "runs",
                  "uri": "https://www.speedrun.com/api/v1/runs?platform=kz9wlm6p"
                }
              ],
              "name": "Analogue Nt Mini",
              "released": 2015
            },
            "status": 200
          }
