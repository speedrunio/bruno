info:
  name: get leaderboard by level
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/src/leaderboards/{{slug_game}}/level/{{slug_level}}/{{slug_category}}
  auth: inherit

runtime:
  variables:
    - name: slug_game
      value: 76rqmld8
    - name: slug_level
      value: kwj14q7w
    - name: slug_category
      value: wkpq608d

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

