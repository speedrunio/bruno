info:
  name: get category
  type: http
  seq: 1

http:
  method: GET
  url: https://api.speedrun.io/src/categories/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: jdz8oprd
      description: example category id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "celeste: all red berries"
    description: use an ID to get a specific category
