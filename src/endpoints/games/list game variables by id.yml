info:
  name: list game variables by id
  type: http
  seq: 8

http:
  method: GET
  url: https://api.speedrun.io/src/games/{{slug}}/variables
  auth: inherit

runtime:
  variables:
    - name: slug
      value: 9d3kqg1l
      description: example game id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

