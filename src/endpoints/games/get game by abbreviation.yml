info:
  name: get game by abbreviation
  type: http
  seq: 2

http:
  method: GET
  url: https://api.speedrun.io/src/games/{{slug}}
  auth: inherit

runtime:
  variables:
    - name: slug
      value: oot
      description: example game id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
