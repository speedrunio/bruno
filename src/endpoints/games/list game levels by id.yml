info:
  name: list game levels by id
  type: http
  seq: 6

http:
  method: GET
  url: https://api.speedrun.io/src/games/{{slug}}/levels
  auth: inherit

runtime:
  variables:
    - name: slug
      value: 3dxy5vv6
      description: example game id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

